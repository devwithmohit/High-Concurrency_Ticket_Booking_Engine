services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_engine"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ticket-engine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-booking-engine-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # JVM tuning flags for 512MB RAM free-tier container memory optimization
      JAVA_TOOL_OPTIONS: "-Xmx320m -Xms200m -XX:MaxMetaspaceSize=96m -XX:+UseG1GC"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ticket_engine
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_SSL_ENABLED: "false"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  k6:
    image: grafana/k6:latest
    container_name: ticket-engine-k6
    profiles: ["test"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8080
      - VUS=100
    volumes:
      - ./load-test.js:/load-test.js
    command: ["run", "/load-test.js"]

volumes:
  postgres_data:
  redis_data:
