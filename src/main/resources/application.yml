server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ticket-booking-engine

  # --------------------------------------------------------------------------
  # Database & HikariCP Connection Pool Configuration (Optimized for 512MB RAM)
  # --------------------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticket_engine}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TicketEngineHikariCP
      maximum-pool-size: 5          # Strict constraint for free-tier Neon/Supabase DB limits
      minimum-idle: 1               # Minimal footprint while idling
      connection-timeout: 10000     # 10s timeout to tolerate serverless/free-tier cold starts
      idle-timeout: 300000          # 5 minutes
      max-lifetime: 900000          # 15 minutes
      validation-timeout: 3000      # 3 seconds
      leak-detection-threshold: 20000 # Warn if a connection is held > 20s

  # --------------------------------------------------------------------------
  # Flyway Migration Configuration
  # --------------------------------------------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # --------------------------------------------------------------------------
  # JPA / Hibernate Configuration
  # --------------------------------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  # --------------------------------------------------------------------------
  # Redis Connection Properties (Supports local & Upstash rediss:// TLS)
  # --------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms
      connect-timeout: 5000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 2000ms

# ----------------------------------------------------------------------------
# Actuator Health Checks (DB & Redis Health Indicators Enabled)
# ----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
